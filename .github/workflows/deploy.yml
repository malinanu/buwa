name: Deploy to CloudPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; a newer push cancels an older queued one.
concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check required secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          missing=0
          for v in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS DEPLOY_PATH; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret $v"; missing=1; fi
          done
          exit $missing

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key (no ssh-keyscan at deploy time = no MITM window)
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Build release folder
        run: |
          mkdir -p release
          rsync -a \
            --exclude '.git' --exclude '.github' \
            --exclude 'README.md' --exclude 'DEPLOY.md' \
            ./ release/
          ls -la release

      - name: Deploy with rsync
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          PORT="${SSH_PORT:-22}"
          SSH="ssh -i ~/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=yes -o BatchMode=yes"
          # Sanity check: refuse to deploy into an unexpected location
          $SSH "$SSH_USER@$SSH_HOST" "test -d '$DEPLOY_PATH' && case '$DEPLOY_PATH' in /home/*/htdocs/*) exit 0;; *) echo 'DEPLOY_PATH must be a CloudPanel htdocs folder' >&2; exit 1;; esac"
          # --delay-updates swaps files in at the end, so visitors never see a half-uploaded site
          rsync -rlptz --delete-after --delay-updates \
            --chmod=D755,F644 \
            -e "$SSH" \
            release/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Smoke test
        if: ${{ vars.SITE_URL != '' }}
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          case "$SITE_URL" in
            http://*|https://*) ;;
            *) echo "::error::SITE_URL must start with https:// (got '$SITE_URL')"; exit 1;;
          esac
          host=$(echo "$SITE_URL" | sed -E 's#^https?://([^/:]+).*#\1#')
          ip=$(getent hosts "$host" | awk '{print $1; exit}' || true)
          if [ -z "$ip" ]; then
            echo "::error::DNS for '$host' does not resolve yet. Files ARE deployed; add an A record for $host pointing to your server, then re-run this job."
            exit 1
          fi
          echo "$host resolves to $ip"
          [ -n "$SSH_HOST" ] && [ "$ip" != "$SSH_HOST" ] && echo "::warning::$host points to $ip, not the deploy server $SSH_HOST"
          for i in 1 2 3; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$SITE_URL/?v=${GITHUB_SHA::7}" || true)
            echo "Attempt $i: HTTP ${code:-no response}"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          echo "::error::$SITE_URL did not return 200. Check the SSL certificate and that DEPLOY_PATH is the site's root."
          exit 1

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/deploy_key
